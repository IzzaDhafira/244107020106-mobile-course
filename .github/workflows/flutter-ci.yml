name: Flutter CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter workspace
        run: |
          flutter create ci_runner_app --platforms=android
          rm -f ci_runner_app/test/widget_test.dart
          cat << 'EOF' > ci_runner_app/lib/note_app.dart
          import 'package:flutter/material.dart';

          class NoteService {
            String? validateTitle(String rawTitle) {
              final clean = rawTitle.trim();
              if (clean.isEmpty) return 'Judul catatan tidak boleh kosong';
              if (clean.length < 3) return 'Judul minimal 3 karakter';
              return null;
            }
          }

          class NoteManagerPage extends StatefulWidget {
            const NoteManagerPage({super.key});

            @override
            State<NoteManagerPage> createState() => _NoteManagerPageState();
          }

          class _NoteManagerPageState extends State<NoteManagerPage> {
            final _service = NoteService();
            final _controller = TextEditingController();
            final List<String> _notes = [];
            String? _error;

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            void _add() {
              final err = _service.validateTitle(_controller.text);
              if (err != null) {
                setState(() => _error = err);
                return;
              }
              setState(() {
                _notes.add(_controller.text.trim());
                _controller.clear();
                _error = null;
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Daftar Tugas & Catatan')),
                body: Column(
                  children: [
                    TextField(key: const Key('note_input_field'), controller: _controller),
                    ElevatedButton(key: const Key('add_note_button'), onPressed: _add, child: const Text('Tambah')),
                    if (_error != null) Text(_error!),
                    Expanded(
                      child: _notes.isEmpty
                          ? const Center(child: Text('Belum ada catatan'))
                          : ListView.builder(
                              itemCount: _notes.length,
                              itemBuilder: (_, i) => ListTile(title: Text(_notes[i])),
                            ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

          cat << 'EOF' > ci_runner_app/test/note_suite_test.dart
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:ci_runner_app/note_app.dart';

          void main() {
            test('validasi judul kosong dan pendek', () {
              final service = NoteService();
              expect(service.validateTitle('  '), 'Judul catatan tidak boleh kosong');
              expect(service.validateTitle('ab'), 'Judul minimal 3 karakter');
              expect(service.validateTitle('Tugas Week 13'), isNull);
            });

            testWidgets('tambah catatan ke daftar', (tester) async {
              await tester.pumpWidget(const MaterialApp(home: NoteManagerPage()));
              expect(find.text('Belum ada catatan'), findsOneWidget);

              await tester.enterText(find.byKey(const Key('note_input_field')), 'Selesai CI/CD');
              await tester.tap(find.byKey(const Key('add_note_button')));
              await tester.pump();

              expect(find.text('Selesai CI/CD'), findsOneWidget);
            });
          }
          EOF

      - name: Install dependencies
        working-directory: ci_runner_app
        run: flutter pub get

      - name: Verify Dart formatting
        working-directory: ci_runner_app
        run: |
          dart format .
          dart format --output=none --set-exit-if-changed .

      - name: Run static analysis
        working-directory: ci_runner_app
        run: flutter analyze --fatal-infos

      - name: Run automated tests with coverage
        working-directory: ci_runner_app
        run: flutter test --coverage

      - name: Build Android APK (Release)
        working-directory: ci_runner_app
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        working-directory: ci_runner_app
        run: flutter build appbundle --release

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            ci_runner_app/build/app/outputs/flutter-apk/app-release.apk
            ci_runner_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7